<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Launcit</title>
    <script type="text/javascript">
      // GitHub Pages SPA router redirection for subpath repositories
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var segments = l.pathname.split('/').filter(Boolean);
      var repoBase = segments.length > 0 ? '/' + segments[0] : '';
      
      // If requesting ver.html, redirect directly to ver.html
      if (l.pathname.endsWith('ver.html')) {
        l.replace(repoBase + '/ver.html' + l.search + l.hash);
      } else {
        l.replace(repoBase + '/' + l.search + l.hash);
      }
    </script>
  </head>
  <body>
    Redirigiendo a Launcit...
  </body>
</html>
